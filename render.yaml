services:
  - type: web
    name: twocali
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: twocali-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TWOCALI_DB
        value: /data/leads.db
      - key: ADMIN_PASSWORD
        sync: false
